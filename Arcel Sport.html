<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcel Sport</title>
  <style>
/* ARCEL SPORT — STYLE PRINCIPAL */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9;
    color: #101828;
    line-height: 1.6;
}

/* HEADER */

.header {
    background: #071a3d;
    color: #ffffff;
    min-height: 72px;
    padding: 14px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #f4c542;
    text-decoration: none;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.5px;
}

.logo-img {
    height: 44px;
    width: auto;
    display: block;
}

.logo:hover {
    color: #ffffff;
}

/* =========================================
   NAVIGATION
   ========================================= */

nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
}

nav a {
    color: #ffffff;
    text-decoration: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: 0.25s ease;
}

nav a:hover {
    color: #f4c542;
}

.menu-btn {
    display: none;
    background: #f4c542;
    color: #071a3d;
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    font-size: 20px;
    cursor: pointer;
}

/* =========================================
   HERO — ACCUEIL
   ========================================= */

.hero {
    background:
        linear-gradient(
            120deg,
            rgba(7, 26, 61, 0.98),
            rgba(16, 45, 98, 0.95)
        );

    color: #ffffff;
    padding: 95px 8%;
    min-height: 430px;

    display: flex;
    align-items: center;
}

.hero > div {
    max-width: 850px;
}

.tag {
    color: #f4c542;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.hero h1 {
    font-size: 50px;
    line-height: 1.08;
    margin: 12px 0 20px;
    font-weight: 900;
}

.hero h1 span {
    color: #f4c542;
    display: block;
}

.hero p {
    font-size: 18px;
    max-width: 700px;
    margin-bottom: 28px;
}

/* =========================================
   BOUTONS
   ========================================= */

button {
    background: #f4c542;
    color: #071a3d;
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.25s ease;
}

button:hover {
    transform: translateY(-2px);
    background: #ffd85a;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
}

/* =========================================
   SECTIONS
   ========================================= */

.section {
    width: 88%;
    max-width: 1150px;
    margin: 50px auto;
}

.section > h2 {
    font-size: 28px;
    color: #071a3d;
    margin-bottom: 25px;
}

/* =========================================
   TITRES DE PAGES
   ========================================= */

.page-title {
    background: #071a3d;
    color: #ffffff;
    padding: 60px 7%;
}

.page-title h1 {
    color: #f4c542;
    font-size: 40px;
    line-height: 1.2;
    margin-bottom: 10px;
}

.page-title p {
    font-size: 17px;
    color: #e7eaf0;
}

/* =========================================
   CARTES
   ========================================= */

.cards {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(240px, 1fr)
    );
    gap: 22px;
}

.card {
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(16, 24, 40, 0.08);
    border: 1px solid #e7eaf0;
    transition: 0.25s ease;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 22px rgba(16, 24, 40, 0.12);
}

.card small {
    color: #667085;
    font-size: 13px;
    font-weight: 700;
}

.card h2,
.card h3 {
    color: #071a3d;
    margin: 10px 0 12px;
    line-height: 1.3;
}

.card p {
    color: #475467;
    line-height: 1.65;
    margin-bottom: 17px;
}

/* =========================================
   MATCHS / RÉSULTATS
   ========================================= */

.match {
    background: #ffffff;
    padding: 22px;
    margin: 15px 0;
    border-radius: 12px;

    box-shadow: 0 3px 15px rgba(16, 24, 40, 0.08);

    display: grid;
    grid-template-columns: 1fr auto 1fr;

    gap: 20px;
    align-items: center;
    text-align: center;
}

.match strong {
    color: #071a3d;
}

.match b {
    font-size: 23px;
    color: #071a3d;
    background: #f4c542;
    padding: 6px 12px;
    border-radius: 7px;
}

/* =========================================
   CLASSEMENTS
   ========================================= */

table {
    width: 100%;
    background: #ffffff;
    border-collapse: collapse;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 15px rgba(16, 24, 40, 0.08);
}

th,
td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid #eaecf0;
}

th {
    background: #071a3d;
    color: #ffffff;
    font-weight: 800;
}

td {
    color: #344054;
}

tr:hover td {
    background: #fafafa;
}

/* =========================================
   FORMULAIRE CONTACT
   ========================================= */

form {
    width: 100%;
    max-width: 650px;
    display: grid;
    gap: 16px;
}

input,
textarea {
    width: 100%;
    padding: 14px 16px;

    border: 1px solid #ccd2da;
    border-radius: 8px;

    background: #ffffff;
    color: #101828;

    font-family: inherit;
    font-size: 15px;

    outline: none;
    transition: 0.2s ease;
}

input:focus,
textarea:focus {
    border-color: #f4c542;
    box-shadow: 0 0 0 3px rgba(244, 197, 66, 0.18);
}

textarea {
    min-height: 160px;
    resize: vertical;
}

/* =========================================
   FOOTER
   ========================================= */

footer {
    background: #071a3d;
    color: #ffffff;
    text-align: center;
    padding: 40px 20px;
    margin-top: 70px;
}

footer h3 {
    color: #f4c542;
    font-size: 22px;
    margin-bottom: 10px;
}

footer p {
    color: #d9deea;
    margin: 5px 0;
}

/* =========================================
   LIENS
   ========================================= */

a {
    transition: 0.25s ease;
}

/* =========================================
   VERSION MOBILE — SAMSUNG A16
   ========================================= */

@media (max-width: 700px) {

    .header {
        padding: 14px 4%;
        min-height: 65px;
        flex-wrap: wrap;
    }

    .logo {
        font-size: 19px;
    }

    .logo-img {
        height: 38px;
    }

    .menu-btn {
        display: block;
    }

    nav {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        background: #0b2452;
        padding: 8px 0;
        border-radius: 8px;
    }

    nav.open {
        display: flex;
    }

    nav a {
        padding: 13px 15px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    nav a:last-child {
        border-bottom: none;
    }

    .hero {
        padding: 70px 6%;
        min-height: 400px;
    }

    .hero h1 {
        font-size: 36px;
    }

    .hero p {
        font-size: 16px;
    }

    .page-title {
        padding: 45px 6%;
    }

    .page-title h1 {
        font-size: 32px;
    }

    .section {
        width: 92%;
        margin: 38px auto;
    }

    .section > h2 {
        font-size: 24px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 21px;
    }

    .match {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .match b {
        display: inline-block;
        justify-self: center;
    }

    table {
        font-size: 14px;
    }

    th,
    td {
        padding: 12px 9px;
    }

    footer {
        margin-top: 45px;
        padding: 32px 15px;
    }
}

/* =========================================
   PETITS ÉCRANS
   ========================================= */

@media (max-width: 400px) {

    .hero h1 {
        font-size: 31px;
    }

    .page-title h1 {
        font-size: 28px;
    }

    .logo {
        font-size: 17px;
    }

    button:not(.menu-btn) {
        width: 100%;
    }
}
  </style>

// ===============================
// AFFICHAGE DE LA PAGE
// ===============================

function afficherPage(page) {

    const nav = document.getElementById("menu");
    if (nav) nav.classList.remove("open");

    const contenu = document.getElementById("app");

    if (!contenu) {
        console.error("L'élément #app est introuvable.");
        return;
    }

    switch (page) {

        // ===============================
        // ACCUEIL
        // ===============================

        case "accueil":

            contenu.innerHTML = `
                <section class="hero">
                    <div>
                        <p class="tag">ACTUALITÉ FOOTBALL</p>

                        <h1>
                            Le football en direct
                            <span>avec Arcel Sport.</span>
                        </h1>

                        <p>
                            Actualités, résultats, classements,
                            joueurs et clubs.
                        </p>

                        <button onclick="afficherPage('actualites')">
                            Voir les actualités
                        </button>
                    </div>
                </section>

                <section class="section">
                    <h2>📰 Dernières actualités</h2>

                    <div class="cards">
                        ${articles.map(article => `
                            <article class="card">

                                <small>${article.categorie}</small>

                                <h3>${article.titre}</h3>

                                <p>${article.texte}</p>

                                <button onclick="afficherPage('actualites')">
                                    Lire plus →
                                </button>

                            </article>
                        `).join("")}
                    </div>
                </section>
            `;

            break;


        // ===============================
        // ACTUALITÉS
        // ===============================

        case "actualites":

            contenu.innerHTML = `
                <section class="page-title">
                    <h1>📰 Actualités</h1>
                    <p>Les dernières informations football.</p>
                </section>

                <section class="section">

                    <div class="cards">

                        ${articles.map(article => `
                            <article class="card">

                                <small>${article.categorie}</small>

                                <h2>${article.titre}</h2>

                                <p>${article.texte}</p>

                                <button>
                                    Lire l'article →
                                </button>

                            </article>
                        `).join("")}

                    </div>

                </section>
            `;

            break;


        // ===============================
        // RÉSULTATS
        // ===============================

        case "resultats":

            contenu.innerHTML = `
                <section class="page-title">

                    <h1>⚽ Résultats</h1>

                    <p>
                        Retrouvez les derniers scores.
                    </p>

                </section>

                <section class="section">

                    ${resultats.map(match => `
                        <div class="match">

                            <strong>${match.equipe1}</strong>

                            <b>${match.score}</b>

                            <strong>${match.equipe2}</strong>

                        </div>
                    `).join("")}

                </section>
            `;

            break;


        // ===============================
        // CLASSEMENT
        // ===============================

        case "classements":

            contenu.innerHTML = `
                <section class="page-title">

                    <h1>🏆 Classements</h1>

                    <p>
                        Classement des équipes.
                    </p>

                </section>

                <section class="section">

                    <table>

                        <thead>

                            <tr>
                                <th>#</th>
                                <th>Équipe</th>
                                <th>Points</th>
                            </tr>

                        </thead>

                        <tbody>

                            ${classement.map(equipe => `
                                <tr>

                                    <td>${equipe.position}</td>

                                    <td>${equipe.equipe}</td>

                                    <td>${equipe.points}</td>

                                </tr>
                            `).join("")}

                        </tbody>

                    </table>

                </section>
            `;

            break;


        // ===============================
        // JOUEURS
        // ===============================

        case "joueurs":

            contenu.innerHTML = `
                <section class="page-title">

                    <h1>👤 Joueurs</h1>

                    <p>
                        Découvrez les joueurs suivis par Arcel Sport.
                    </p>

                </section>

                <section class="section">

                    <div class="cards">

                        ${joueurs.map(joueur => `
                            <article class="card">

                                <h2>${joueur.nom}</h2>

                                <p>
                                    <strong>Club :</strong>
                                    ${joueur.club}
                                </p>

                                <p>
                                    <strong>Poste :</strong>
                                    ${joueur.poste}
                                </p>

                            </article>
                        `).join("")}

                    </div>

                </section>
            `;

            break;


        // ===============================
        // CLUBS
        // ===============================

        case "clubs":

            contenu.innerHTML = `
                <section class="page-title">

                    <h1>🏟️ Clubs</h1>

                    <p>
                        Les clubs suivis par Arcel Sport.
                    </p>

                </section>

                <section class="section">

                    <div class="cards">

        case "contact":

            contenu.innerHTML = `
                <section class="page-title">

                    <h1>📞 Contact</h1>

                    <p>
                        Contactez l'équipe Arcel Sport.
                    </p>

                </section>

                <section class="section">

                            required
                        >

                        <textarea
                            placeholder="Votre message"
                            required

                        <button type="submit">
                            Envoyer

                    </form>

                </section>

                    event.preventDefault();

                    alert(

                    this.reset();

                });

            break;


        default:

            afficherPage("accueil");
    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
